# ============================================================
# WORKFLOW 3: DOCKER BUILD & PUSH
# ============================================================
# What this does:
# Packages your app into a Docker container and pushes it
# to Docker Hub so it can be deployed anywhere in the world.
#
# Why it matters:
# "Works on my machine" doesn't cut it in production.
# Docker containers include everything your app needs to run —
# same environment every time, everywhere.
#
# Prerequisites:
# Add these secrets to your GitHub repo settings:
# - DOCKERHUB_USERNAME → your Docker Hub username
# - DOCKERHUB_TOKEN → Docker Hub access token (not your password!)
# ============================================================

name: Docker Build & Push

on:
 push:
 branches: [main] # Only build and push from main
 workflow_dispatch: # Also allow manual trigger from GitHub UI

jobs:
 docker:
 name: Build and push Docker image
 runs-on: ubuntu-latest

 steps:
 # Step 1: Check out the code
 - name: Checkout code
 uses: actions/checkout@v4

 # Step 2: Log in to Docker Hub
 # Uses secrets stored in GitHub — never hardcode credentials!
 - name: Log in to Docker Hub
 uses: docker/login-action@v3
 with:
 username: ${{ secrets.DOCKERHUB_USERNAME }}
 password: ${{ secrets.DOCKERHUB_TOKEN }}

 # Step 3: Set up Docker Buildx (enables advanced build features)
 - name: Set up Docker Buildx
 uses: docker/setup-buildx-action@v3

 # Step 4: Build the image and push to Docker Hub
 # Tags the image with both the commit SHA and "latest"
 - name: Build and push image
 uses: docker/build-push-action@v5
 with:
 context: .
 push: true
 tags: |
 ${{ secrets.DOCKERHUB_USERNAME }}/freshkids-demo:latest
 ${{ secrets.DOCKERHUB_USERNAME }}/freshkids-demo:${{ github.sha }}
 cache-from: type=gha # Use GitHub Actions cache to speed up builds
 cache-to: type=gha,mode=max

 # Step 5: Print the image digest so we have a record
 - name: Print image digest
 run: echo "Image pushed successfully! Check Docker Hub for your new image."
