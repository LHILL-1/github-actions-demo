# ============================================================
# WORKFLOW 1: SECRET SCANNING
# ============================================================
# What this does:
# Scans every commit for accidentally leaked secrets like
# API keys, passwords, or tokens BEFORE they reach main.
#
# Why it matters:
# The Uber 2022 breach started with exposed credentials.
# This step costs 30 seconds and can save your company millions.
#
# Tool used: TruffleHog (free, open source)
# ============================================================

name: Secret Scanning

on:
 push:
 branches: ["**"] # Run on every branch push
 pull_request:
 branches: [main] # Also run on PRs to main

jobs:
 secret-scan:
 name: Scan for leaked secrets
 runs-on: ubuntu-latest

 steps:
 # Step 1: Check out the code
 - name: Checkout code
 uses: actions/checkout@v4
 with:
 fetch-depth: 0 # Full history needed so TruffleHog can diff commits

 # Step 2: Run TruffleHog
 # TruffleHog looks for high-entropy strings and known secret patterns
 - name: Run TruffleHog secret scan
 uses: trufflesecurity/trufflehog@main
 with:
 path: ./
 base: ${{ github.event.repository.default_branch }}
 head: HEAD
 extra_args: --debug --only-verified

 # Step 3: Let the team know the result
 - name: Secret scan passed
 run: echo "No secrets detected — safe to continue pipeline!"
